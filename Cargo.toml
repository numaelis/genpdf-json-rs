[package]
name = "genpdf-json"
version = "0.1.0"
edition = "2024"
authors = [
    "Numael Garay <mantrixsoft@gmail.com>"
]
exclude = [".builds/*"]
keywords = ["json", "pdf", "text", "layout"]
homepage = ""
repository = ""
license = "GPL3"

[dependencies]
#support json rckive-genpdf-rs -> https://github.com/numaelis/rckive-genpdf-rs.git
rckive-genpdf = {path = "../rckive-genpdf-rs/" , features = ["images", "hyphenation"]}
image = "0.25"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package]
name = "genpdf-json"
version = "0.1.14"
edition = "2024"
authors = [
    "Numael Garay <mantrixsoft@gmail.com>"
]
categories = ["text-processing"]
description = "PDF generator using JSON data "
exclude = [".builds/*"]
keywords = ["json", "pdf", "text", "layout"]
homepage = "https://github.com/numaelis/genpdf-json-rs"
repository = "https://github.com/numaelis/genpdf-json-rs"
license = "GPL-3.0-only"    

[dependencies]
#support json rckive-genpdf-rs -> https://github.com/numaelis/rckive-genpdf-rs.git
# numaelis-rckive-genpdf = {version = "0.4.5", git = "https://github.com/numaelis/rckive-genpdf-rs.git", features = ["images", "hyphenation"]}
# numaelis-rckive-genpdf = {version = "0.4.5", path = "rckive-genpdf/", features = ["images", "hyphenation"]}
numaelis-rckive-genpdf = {version = "0.4.5", features = ["images", "hyphenation"]}
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = "0.29.0"
hyphenation = { version = "0.8", features = ["embed_en-us"] }
